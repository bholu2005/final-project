global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape web platform endpoints
  - job_name: 'merlin-app'
    static_configs:
      - targets: ['localhost:8000']

  # Scrape Qdrant Vector database telemetry metrics
  - job_name: 'qdrant-vector-db'
    static_configs:
      - targets: ['qdrant-db:6333']
