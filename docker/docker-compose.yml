version: '3.8'

services:
  # 1. Laravel + React Web Platform Service
  merlin-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DB_CONNECTION=sqlite
    volumes:
      - ../storage:/app/storage
    depends_on:
      - qdrant-db
      - redis-cache

  # 2. Vector Database Store
  qdrant-db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # 3. Redis Cache & Job Queue Broker
  redis-cache:
    image: redis:alpine
    ports:
      - "6379:6333"

  # 4. Prometheus Metrics Monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  qdrant_data:
